# Umami: estadísticas de visitas del portfolio, autoalojadas, gratis y sin cookies.
# En el servidor (.48):  mkdir -p /opt/umami && copiar aquí este archivo y un .env con las dos claves de abajo.
#   APP_SECRET=una-cadena-larga-aleatoria      (openssl rand -hex 32)
#   POSTGRES_PASSWORD=otra-cadena-larga        (openssl rand -hex 24)
# Luego: cd /opt/umami && docker compose up -d
services:
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:${POSTGRES_PASSWORD}@umami-db:5432/umami
      APP_SECRET: ${APP_SECRET}
    depends_on:
      umami-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3005:3000" # solo accesible a través de Caddy
  umami-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - umami-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  umami-datos:
